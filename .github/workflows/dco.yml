name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            if git log -1 --format=%s "$sha" | grep -qi '^Merge '; then continue; fi
            if ! git log -1 --format='%(trailers:key=Signed-off-by)' "$sha" | grep -q .; then
              author="$(git log -1 --format='%an <%ae>' "$sha")"
              if ! git log -1 --format=%B "$sha" | grep -q "^Signed-off-by: $author"; then
                echo "::error::commit $sha lacks a Signed-off-by trailer matching its author ($author)"
                fail=1
              fi
            fi
          done
          exit $fail
