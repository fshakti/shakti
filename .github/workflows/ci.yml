name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl libexpat1-dev libx11-dev libasound2-dev libssl-dev
      - name: Build
        run: make -j4
      - name: Test
        env:
          SHAKTI_GFX_SKIP: "1"
        run: make test
      - name: SPDX headers present
        run: |
          missing=0
          for f in src/*.c src/*.h lib/*.ie; do
            head -c 200 "$f" | grep -q "SPDX-License-Identifier: Apache-2.0" || { echo "missing SPDX: $f"; missing=1; }
          done
          exit $missing
